<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Wortschatz</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Wortschatz">
  <meta name="theme-color" content="#1F6F5C">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <a class="app-header__title" href="#/dashboard">Wortschatz</a>
    <nav class="app-header__nav" id="app-nav">
      <a href="#/words" data-route="words">Kelimeler</a>
      <a href="#/stats" data-route="stats">İstatistik</a>
      <a href="#/settings" data-route="settings">Ayarlar</a>
    </nav>
  </header>

  <main class="app-main" id="app">
    <div class="spinner">Yükleniyor…</div>
  </main>

  <script type="module" src="js/app.js"></script>
  <script>
    // An installed home-screen app on iOS is often just resumed from the
    // background rather than freshly reloaded, so a normal "reload the page"
    // update flow can go unnoticed for a long time. This forces an update
    // check whenever the app becomes visible again, and reloads immediately
    // once a new version has actually taken control - no manual force-quit
    // needed for an update to reach the screen.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        const reg = await navigator.serviceWorker.register("sw.js", { scope: "./" });
        reg.update();
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") reg.update();
        });
      });
      let reloadedForUpdate = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (reloadedForUpdate) return;
        reloadedForUpdate = true;
        location.reload();
      });
    }
  </script>
</body>
</html>
